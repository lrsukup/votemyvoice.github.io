<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — VoteMyVoice</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root { --navy:#000A7D; --sky-mid:#80CFF1; --red-lt:#FFE8EA; --green:#1A7A3C; --green-lt:#E3F5EB; --ink:#0A0520; --ink-lt:#8A82A0; --surface:#F8F7FC; --border:#EAE8F2; --white:#fff; }
  body { font-family:'Outfit',sans-serif; background:var(--surface); color:var(--ink); min-height:100vh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }
  .header { background:linear-gradient(135deg,#000A7D 0%,#1a0f6b 60%,#2a0a6e 100%); padding:32px 24px; text-align:center; position:relative; overflow:hidden; }
  .header::before { content:''; position:absolute; width:200px; height:200px; border-radius:50%; background:rgba(0,159,227,0.15); top:-60px; right:-40px; pointer-events:none; }
  .logo { font-family:'Fraunces',serif; font-size:22px; color:#fff; letter-spacing:-0.4px; margin-bottom:12px; display:inline-block; text-decoration:none; }
  .logo span { color:var(--sky-mid); }
  .header h1 { font-family:'Fraunces',serif; font-size:24px; color:#fff; letter-spacing:-0.4px; margin-bottom:6px; }
  .header p { font-size:13px; color:rgba(255,255,255,0.6); }
  .main { flex:1; max-width:440px; margin:0 auto; width:100%; padding:32px 24px; }
  .card { background:var(--white); border-radius:16px; border:1px solid var(--border); padding:24px; }
  .field { margin-bottom:16px; }
  .field label { display:block; font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--ink-lt); margin-bottom:6px; }
  .field input { width:100%; padding:11px 14px; border:1.5px solid var(--border); border-radius:10px; font-family:'Outfit',sans-serif; font-size:14px; color:var(--ink); background:var(--white); outline:none; }
  .field input:focus { border-color:var(--navy); box-shadow:0 0 0 3px rgba(0,10,125,0.08); }
  .btn { width:100%; padding:14px; background:var(--navy); color:#fff; border:none; border-radius:99px; font-family:'Outfit',sans-serif; font-size:14px; font-weight:700; cursor:pointer; margin-top:8px; }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .alert { border-radius:10px; padding:12px 14px; font-size:13px; margin-bottom:16px; line-height:1.6; }
  .alert.error   { background:var(--red-lt);   border:1px solid rgba(255,55,68,0.2);  color:#8c0010; }
  .alert.success { background:var(--green-lt); border:1px solid rgba(26,122,60,0.2); color:var(--green); }
  .alert strong  { font-weight:700; display:block; margin-bottom:3px; }
  .app-link { text-align:center; margin-top:20px; font-size:13px; color:var(--ink-lt); }
  .app-link a { color:var(--navy); font-weight:600; }
  .footer { text-align:center; padding:24px; }
  .footer p { font-size:11px; color:var(--ink-lt); }
  .footer a { color:inherit; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .spinner { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,0.35); border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; vertical-align:middle; margin-right:6px; }
</style>
</head>
<body>

<div class="header">
  <a href="/" class="logo">Vote<span>My</span>Voice</a>
  <h1>Reset your password</h1>
  <p>Enter a new password for your account.</p>
</div>

<main class="main">
  <div id="feedback"></div>
  <div id="form-wrap">
    <div class="card">
      <div class="field">
        <label>New password</label>
        <input type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password"/>
      </div>
      <div class="field">
        <label>Confirm password</label>
        <input type="password" id="confirm" placeholder="Re-enter new password" autocomplete="new-password"/>
      </div>
      <button class="btn" id="submit-btn" onclick="handleReset()">Update password</button>
    </div>
  </div>
  <p class="app-link">Open the app: <a href="votemyvoice://sign-in">VoteMyVoice →</a></p>
</main>

<footer class="footer">
  <p>VoteMyVoice &nbsp;·&nbsp; <a href="/privacy.html">Privacy Policy</a></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL  = 'https://yzpiecadbptlyqmsstpb.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6cGllY2FkYnB0bHlxbXNzdHBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDgyNDExMTAsImV4cCI6MjA2MzgxNzExMH0.xMvgGPaY0BXSC1XMl0pnb9SiBJqPJmFf-KbIUer9tN0';

  // IMPORTANT: detectSessionInUrl MUST be false
  // Otherwise Supabase consumes the token on page load before the user submits
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
    auth: {
      detectSessionInUrl: false,
      persistSession: false,
      autoRefreshToken: false,
    }
  });

  // Read tokens from URL hash and store them — do NOT call setSession yet
  const hash    = window.location.hash.substring(1);
  const params  = new URLSearchParams(hash);
  const ACCESS  = params.get('access_token');
  const REFRESH = params.get('refresh_token') || '';
  const TYPE    = params.get('type');

  function showFeedback(type, title, body) {
    document.getElementById('feedback').innerHTML =
      '<div class="alert ' + type + '">' +
      (title ? '<strong>' + title + '</strong>' : '') +
      (body  ? body : '') + '</div>';
  }

  // Validate on load — just check we have the right token type
  if (!ACCESS || TYPE !== 'recovery') {
    showFeedback('error',
      'Invalid reset link.',
      'This link is invalid or has already been used. Please request a new password reset from the VoteMyVoice app.'
    );
    document.getElementById('form-wrap').style.display = 'none';
  }

  async function handleReset() {
    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('confirm').value;
    const btn      = document.getElementById('submit-btn');

    document.getElementById('feedback').innerHTML = '';

    if (!password)            { showFeedback('error', null, 'Please enter a new password.'); return; }
    if (password.length < 8)  { showFeedback('error', null, 'Password must be at least 8 characters.'); return; }
    if (password !== confirm) { showFeedback('error', null, 'Passwords do not match.'); return; }

    btn.disabled  = true;
    btn.innerHTML = '<span class="spinner"></span>Updating…';

    // Step 1 — exchange the recovery token for a live session
    const { error: sessionError } = await client.auth.setSession({
      access_token:  ACCESS,
      refresh_token: REFRESH,
    });

    if (sessionError) {
      showFeedback('error',
        'Link expired.',
        'This reset link has expired. Password reset links are valid for 1 hour. Please request a new one from the app.'
      );
      btn.disabled  = false;
      btn.innerHTML = 'Update password';
      return;
    }

    // Step 2 — update the password using the active session
    const { error: updateError } = await client.auth.updateUser({ password });

    if (updateError) {
      showFeedback('error', 'Could not update password.', updateError.message);
      btn.disabled  = false;
      btn.innerHTML = 'Update password';
    } else {
      document.getElementById('form-wrap').style.display = 'none';
      showFeedback('success',
        '✓ Password updated!',
        'Your password has been changed. Open the VoteMyVoice app and sign in with your new password.'
      );
      history.replaceState(null, '', window.location.pathname);
    }
  }
</script>
</body>
</html>
