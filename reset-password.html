<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — VoteMyVoice</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --navy:#000A7D; --sky:#009FE3; --sky-mid:#80CFF1; --red:#FF3744; --ink:#0A0520; --ink-mid:#4A4060; --ink-lt:#8A82A0; --surface:#F8F7FC; --border:#EAE8F2; --white:#fff; }
  body { font-family:'Outfit',sans-serif; background:var(--surface); color:var(--ink); min-height:100vh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }

  .header { background:linear-gradient(135deg,#000A7D 0%,#1a0f6b 60%,#2a0a6e 100%); padding:32px 24px; text-align:center; position:relative; overflow:hidden; }
  .header::before { content:''; position:absolute; width:200px; height:200px; border-radius:50%; background:rgba(0,159,227,0.15); top:-60px; right:-40px; }
  .logo { font-family:'Fraunces',serif; font-size:22px; color:#fff; letter-spacing:-0.4px; margin-bottom:12px; display:inline-block; text-decoration:none; }
  .logo span { color:var(--sky-mid); }
  .header h1 { font-family:'Fraunces',serif; font-size:24px; color:#fff; letter-spacing:-0.4px; }
  .header p { font-size:13px; color:rgba(255,255,255,0.6); margin-top:6px; }

  .main { flex:1; max-width:420px; margin:0 auto; width:100%; padding:32px 24px; }

  .card { background:var(--white); border-radius:16px; border:1px solid var(--border); padding:24px; }

  .field { margin-bottom:16px; }
  .field label { display:block; font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--ink-lt); margin-bottom:6px; }
  .field input {
    width:100%; padding:11px 14px; border:1.5px solid var(--border);
    border-radius:10px; font-family:'Outfit',sans-serif; font-size:14px;
    color:var(--ink); background:var(--white); outline:none;
  }
  .field input:focus { border-color:var(--navy); box-shadow:0 0 0 3px rgba(0,10,125,0.08); }

  .btn {
    width:100%; padding:14px; background:var(--navy); color:#fff;
    border:none; border-radius:99px; font-family:'Outfit',sans-serif;
    font-size:14px; font-weight:700; cursor:pointer; margin-top:8px;
    letter-spacing:0.1px;
  }
  .btn:hover { opacity:0.9; }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }

  .error { background:#FFE8EA; border:1px solid rgba(255,55,68,0.2); border-radius:10px; padding:10px 14px; font-size:13px; color:#8c0010; margin-bottom:16px; }
  .success { background:#E3F5EB; border:1px solid rgba(26,122,60,0.2); border-radius:10px; padding:16px 14px; font-size:14px; color:#1A7A3C; margin-bottom:16px; text-align:center; line-height:1.6; }
  .success strong { font-weight:700; display:block; margin-bottom:4px; }

  .app-link { display:block; text-align:center; margin-top:16px; }
  .app-link a { font-size:13px; color:var(--navy); font-weight:600; }

  .footer { text-align:center; padding:24px; }
  .footer p { font-size:11px; color:var(--ink-lt); }
</style>
</head>
<body>

<div class="header">
  <a href="/" class="logo">Vote<span>My</span>Voice</a>
  <h1>Reset your password</h1>
  <p>Enter your new password below.</p>
</div>

<main class="main">
  <div id="error-box" class="error" style="display:none"></div>
  <div id="success-box" class="success" style="display:none"></div>

  <div class="card" id="form-card">
    <div class="field">
      <label>New password</label>
      <input type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password"/>
    </div>
    <div class="field">
      <label>Confirm password</label>
      <input type="password" id="confirm" placeholder="Re-enter new password" autocomplete="new-password"/>
    </div>
    <button class="btn" id="submit-btn" onclick="handleReset()">Update password</button>
  </div>

  <div class="app-link">
    <a href="votemyvoice://sign-in">← Open the VoteMyVoice app</a>
  </div>
</main>

<footer class="footer">
  <p>VoteMyVoice · <a href="/privacy.html" style="color:inherit">Privacy Policy</a></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Initialize Supabase client
  const SUPABASE_URL  = 'https://yzpiecadbptlyqmsstpb.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6cGllY2FkYnB0bHlxbXNzdHBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDgyNDExMTAsImV4cCI6MjA2MzgxNzExMH0.xMvgGPaY0BXSC1XMl0pnb9SiBJqPJmFf-KbIUer9tN0';
  const { createClient } = supabase;
  const client = createClient(SUPABASE_URL, SUPABASE_ANON);

  // Extract token from URL hash — Supabase puts it there
  async function init() {
    const hash   = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const type   = params.get('type');
    const token  = params.get('access_token');

    if (type === 'recovery' && token) {
      // Set the session from the recovery token
      const { error } = await client.auth.setSession({
        access_token:  token,
        refresh_token: params.get('refresh_token') || '',
      });
      if (error) showError('This reset link has expired. Please request a new one.');
    } else {
      showError('Invalid or expired reset link. Please request a new password reset from the app.');
      document.getElementById('submit-btn').disabled = true;
    }
  }

  async function handleReset() {
    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('confirm').value;
    const btn      = document.getElementById('submit-btn');

    if (!password || !confirm) { showError('Please enter and confirm your new password.'); return; }
    if (password.length < 8)   { showError('Password must be at least 8 characters.'); return; }
    if (password !== confirm)  { showError('Passwords do not match.'); return; }

    btn.disabled    = true;
    btn.textContent = 'Updating…';

    const { error } = await client.auth.updateUser({ password });

    if (error) {
      showError(error.message || 'Could not update password. Please try again.');
      btn.disabled    = false;
      btn.textContent = 'Update password';
    } else {
      document.getElementById('form-card').style.display = 'none';
      document.getElementById('success-box').style.display = 'block';
      document.getElementById('success-box').innerHTML =
        '<strong>✓ Password updated!</strong>Open the VoteMyVoice app and sign in with your new password.';
    }
  }

  function showError(msg) {
    const el = document.getElementById('error-box');
    el.textContent   = msg;
    el.style.display = 'block';
  }

  init();
</script>
</body>
</html>
